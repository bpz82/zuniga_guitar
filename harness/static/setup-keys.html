<!doctype html>
<!-- TODO before customers: remove this page from the public site (docs/SETUP.md, "Before real customers"). Kept until Blake approves removal. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Setup keys</title>
  <link rel="stylesheet" href="theme/tokens.css">
  <link rel="stylesheet" href="theme/theme.css">
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <h1>One-time setup keys</h1>
  <p>Makes the push keys and cron secret <strong data-zg-tone="warning">in this browser only</strong>. Nothing is sent anywhere or saved. Copy each value straight into your password manager and the Supabase dashboard, then close this tab. <strong data-zg-tone="warning">Never paste them into a chat.</strong> Reloading makes new, different keys.</p>
  <p><label>VAPID_PUBLIC_KEY (public: Supabase function secret and Vercel variable <code>ZG_VAPID_PUBLIC_KEY</code>)<textarea data-zg="key-pub" readonly></textarea></label></p>
  <p><label>VAPID_PRIVATE_KEY (<strong data-zg-tone="warning">secret</strong>: Supabase function secret only)<textarea data-zg="key-priv" readonly></textarea></label></p>
  <p><label>CRON_SECRET (<strong data-zg-tone="warning">secret</strong>: Supabase function secret and the schedule SQL only)<textarea data-zg="key-cron" readonly></textarea></label></p>
  <script>
    // Same as scripts/vapid-keys.mjs, using the browser's built-in crypto.
    const b64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    (async () => {
      const pair = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign']);
      document.querySelector('[data-zg="key-pub"]').value = b64url(await crypto.subtle.exportKey('raw', pair.publicKey));
      document.querySelector('[data-zg="key-priv"]').value = (await crypto.subtle.exportKey('jwk', pair.privateKey)).d;
      document.querySelector('[data-zg="key-cron"]').value = b64url(crypto.getRandomValues(new Uint8Array(32)));
    })();
  </script>
</body>
</html>
